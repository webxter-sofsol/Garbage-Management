{% extends 'base.html' %}
{% block title %}Edit {{ staff_member.name }} — GCMS{% endblock %}

{% block extra_css %}
<style>
  .page-header {
    background: linear-gradient(135deg, #0f5132 0%, #198754 100%);
    padding: 40px 0 32px;
    color: white;
  }
</style>
{% endblock %}

{% block content %}
<!-- Header -->
<div class="page-header">
  <div class="container">
    <div class="d-flex align-items-center gap-3">
      <div style="background:rgba(255,255,255,0.15);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;">
        <i class="bi bi-pencil-square text-white fs-4"></i>
      </div>
      <div>
        <h2 class="fw-bold mb-0">Edit Staff Member</h2>
        <p class="mb-0 opacity-75 small">{{ staff_member.staff_id }}</p>
      </div>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm" style="border-radius:14px;">
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" value="{{ staff_member.name }}" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <input type="text" name="phone" class="form-control" value="{{ staff_member.phone }}" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Duty Status</label>
              <select name="duty_status" class="form-select">
                <option value="off_duty" {% if staff_member.duty_status == 'off_duty' %}selected{% endif %}>Off Duty</option>
                <option value="on_duty" {% if staff_member.duty_status == 'on_duty' %}selected{% endif %}>On Duty</option>
                <option value="on_break" {% if staff_member.duty_status == 'on_break' %}selected{% endif %}>On Break</option>
              </select>
            </div>

            <div class="mb-4">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="is_active" id="isActiveToggle"
                  {% if staff_member.is_active %}checked{% endif %}>
                <label class="form-check-label fw-semibold" for="isActiveToggle">Active Account</label>
              </div>
              <div class="form-text">Inactive staff members cannot log in or receive assignments.</div>
            </div>

            <div class="d-flex gap-3">
              <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-check-lg me-1"></i> Save Changes
              </button>
              <a href="{% url 'staff:staff_detail' staff_member.staff_id %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
